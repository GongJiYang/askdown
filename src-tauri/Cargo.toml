[package]
name = "askdown"
version = "0.1.0"
description = "边读边问：以 Markdown 文档为主体的 AI 阅读与思考工具"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "askdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
